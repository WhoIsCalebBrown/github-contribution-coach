[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "github-contribution-coach"
version = "0.1.0"
description = "Turn GitHub activity imbalances and local work into genuine contribution opportunities."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Caleb Brown" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
contribution-coach = "contribution_coach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
